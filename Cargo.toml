[package]
name = "erisagentauth"
version = "0.2.0"
edition = "2024"
description = "The ChatGPT and Claude logins Eris apps' agents make model calls with: signing in, storing, refreshing"
license = "MIT"
repository = "https://github.com/Eriskii/ErisAgentAuth"
readme = "README.md"

[features]
default = ["harness"]
# `erisharness::provider::Credentials` for both accounts.
harness = ["dep:erisharness", "dep:futures-util"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
erisharness = { git = "https://github.com/Eriskii/ErisHarness", optional = true }
futures-util = { version = "0.3.34", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt", "macros", "io-util", "net", "sync", "time", "process", "fs"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
